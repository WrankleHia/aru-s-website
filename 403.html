<head>

  <style>
    body { 
        font-family: sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }
    
    #error-section { 
        width: 100%;
        max-width: 400px; 
        background: #333; 
        padding: 40px 30px; 
        border-radius: 8px; 
        text-align: center; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
    }

    #error-section h1 {
        font-size: 64px;
        margin: 0 0 10px 0;
        color: #00E0FF;
    }

    #error-section p {
        color: #ddd;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    button { 
        padding: 12px 24px; 
        background: #00E0FF; 
        border: none; 
        cursor: pointer; 
        font-weight: bold; 
        font-size: 16px; 
        border-radius: 4px; 
        transition: 0.3s; 
        color: #000;
        width: 100%;
    }
    
    button:hover { 
        filter: brightness(1.1); 
    }
